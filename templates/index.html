<!DOCTYPE html>
<html>
<head>

<title>Plagiarism Detector</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.container{
background:white;
width:500px;
margin:auto;
margin-top:80px;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

button{
padding:10px 20px;
background:blue;
color:white;
border:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Plagiarism & AI Detector</h2>

<form action="/predict" method="post" enctype="multipart/form-data">

<p>Upload Reference Files</p>
<input type="file" name="reference" multiple required>

<p>Upload User File</p>
<input type="file" name="user" required>

<br><br>

<button type="submit">Check</button>

</form>

</div>

</body>
</html>
